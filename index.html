<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05020a">
<meta name="color-scheme" content="dark">
<title>Masq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Cinzel+Decorative:wght@700;900&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05020a; }
  #root { height: 100%; }
  a { color: #e6cb7e; }
  a:hover { color: #f4d78c; }
  @keyframes imp-spot { 0%,100% { transform: translateX(-14px) rotate(-3deg); opacity:.85 } 50% { transform: translateX(14px) rotate(3deg); opacity:1 } }
  @keyframes imp-float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
  @keyframes imp-tilt { 0%,100% { transform: rotate(-4deg) } 50% { transform: rotate(4deg) } }
  @keyframes imp-shimmer { 0% { background-position: -180% 0 } 100% { background-position: 280% 0 } }
  @keyframes imp-rise { from { opacity:0; transform: translateY(14px) } to { opacity:1; transform: translateY(0) } }
  @keyframes imp-pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(200,162,76,.45) } 50% { box-shadow: 0 0 0 8px rgba(200,162,76,0) } }
  @keyframes imp-slide-up { from { opacity:0; transform: translateY(60px) } to { opacity:1; transform: translateY(0) } }
  @keyframes imp-slide-in { from { opacity:0 } to { opacity:1 } }
  @keyframes imp-fade-in { from { opacity:0 } to { opacity:1 } }
  @keyframes imp-scale-in { from { opacity:0; transform: scale(.94) } to { opacity:1; transform: scale(1) } }
  @keyframes imp-backdrop { from { opacity:0 } to { opacity:1 } }
  .imp-btn { transition: transform .12s ease, opacity .12s ease; }
  .imp-btn:active { transform: scale(.95); opacity:.82; }

  /* ---- Jester Mode ---- */
  .jester-page-fx {
    position: fixed; inset: -40%; pointer-events: none; opacity: .45;
    background: repeating-conic-gradient(from 45deg, rgba(123,47,247,.2) 0deg 90deg, rgba(0,0,0,0) 90deg 180deg);
    background-size: 76px 76px;
    animation: jpage-drift 26s linear infinite, jpage-hue 18s linear infinite;
  }
  @keyframes jpage-drift { to { transform: translate(76px, 76px) } }
  @keyframes jpage-hue { to { filter: hue-rotate(360deg) } }
  .jester-fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .jfx { position: absolute; bottom: -4%; opacity: 0; animation: jfx-rise linear infinite; }
  .jfx.c0 { color: #ffd23f; text-shadow: 0 0 9px rgba(255,210,63,.85); }
  .jfx.c1 { color: #ff3d8b; text-shadow: 0 0 9px rgba(255,61,139,.85); }
  .jfx.c2 { color: #a78bfa; text-shadow: 0 0 9px rgba(139,92,246,.95); }
  .jfx.c3 { color: #4ade80; text-shadow: 0 0 9px rgba(74,222,128,.85); }
  @keyframes jfx-rise {
    0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0 }
    8%   { opacity: .8 }
    50%  { transform: translateY(-480px) translateX(16px) rotate(210deg); opacity: .55 }
    92%  { opacity: .35 }
    100% { transform: translateY(-980px) translateX(-12px) rotate(420deg); opacity: 0 }
  }
  body.jester .j-title {
    background: linear-gradient(90deg, #ffd23f, #ff3d8b, #a78bfa, #4ade80, #ffd23f);
    background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: j-shimmer 3.2s linear infinite;
  }
  @keyframes j-shimmer { to { background-position: 250% 0 } }
  body.jester .j-glow { animation: j-cta 2.4s ease-in-out infinite; }
  @keyframes j-cta {
    0%, 100% { box-shadow: 0 8px 26px rgba(255,61,139,.5), 0 0 0 0 rgba(255,210,63,.35) }
    50%      { box-shadow: 0 10px 34px rgba(139,92,246,.6), 0 0 24px 4px rgba(255,210,63,.22) }
  }
  /* periodic light sweep across the phone shell */
  .jester-fx::before {
    content: ''; position: absolute; inset: -50%;
    background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,.07) 47%, rgba(255,210,63,.13) 51%, transparent 60%);
    animation: j-sweep 7s ease-in-out infinite;
  }
  @keyframes j-sweep { 0%, 55% { transform: translateX(-65%) } 100% { transform: translateX(65%) } }
  /* dancing MASQ letters (shimmer + bounce share the animation slot) */
  body.jester .j-dance {
    display: inline-block;
    animation: j-shimmer 3.2s linear infinite, j-dance 1.5s ease-in-out infinite;
  }
  @keyframes j-dance {
    0%, 100% { transform: translateY(0) rotate(0deg) }
    30%      { transform: translateY(-4px) rotate(-5deg) }
    60%      { transform: translateY(1px) rotate(4deg) }
  }
  /* holographic-foil reveal card (tilt driven from JS via --hx/--hy) */
  body.jester .j-card { transition: transform .18s ease; will-change: transform; }
  .j-holo {
    position: absolute; inset: 0; pointer-events: none;
    mix-blend-mode: color-dodge; opacity: .5;
    background:
      radial-gradient(circle at var(--hx, 50%) var(--hy, 40%), rgba(255,255,255,.85), transparent 42%),
      repeating-linear-gradient(115deg,
        rgba(255,0,128,.28) 0 12px, rgba(255,210,63,.28) 12px 24px,
        rgba(0,255,170,.28) 24px 36px, rgba(80,120,255,.28) 36px 48px);
    filter: blur(1px) saturate(1.6);
    animation: j-holo-idle 5s ease-in-out infinite alternate;
  }
  @keyframes j-holo-idle { from { background-position: 0 0, 0 0 } to { background-position: 0 0, 60px 30px } }
  /* pointer spark trail */
  .j-spark {
    position: fixed; z-index: 9999; pointer-events: none;
    transform: translate(-50%, -50%);
    text-shadow: 0 0 8px currentColor;
    animation: j-spark .85s ease-out forwards;
  }
  @keyframes j-spark {
    0%   { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg) }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% - 48px)) scale(.35) rotate(170deg) }
  }
  /* results: rotating carnival ray-wheel behind the mask */
  .j-rays {
    position: absolute; inset: -70px; pointer-events: none; border-radius: 50%;
    background: repeating-conic-gradient(rgba(255,210,63,.25) 0deg 12deg, transparent 12deg 24deg);
    -webkit-mask-image: radial-gradient(circle, #000 28%, transparent 68%);
    mask-image: radial-gradient(circle, #000 28%, transparent 68%);
    animation: j-spin 14s linear infinite;
  }
  @keyframes j-spin { to { transform: rotate(360deg) } }
  /* results: one-shot confetti explosion */
  .j-burst { position: absolute; left: 50%; top: 38%; pointer-events: none; }
  .jb { position: absolute; font-size: 15px; opacity: 0; animation: j-burst 1.1s cubic-bezier(.2,.7,.3,1) forwards; }
  .jb.b0 { color: #ffd23f; text-shadow: 0 0 10px rgba(255,210,63,.9); }
  .jb.b1 { color: #ff3d8b; text-shadow: 0 0 10px rgba(255,61,139,.9); }
  .jb.b2 { color: #a78bfa; text-shadow: 0 0 10px rgba(139,92,246,.95); }
  .jb.b3 { color: #4ade80; text-shadow: 0 0 10px rgba(74,222,128,.9); }
  @keyframes j-burst {
    0%   { opacity: 1; transform: rotate(var(--ang)) translateX(6px) scale(1.1) }
    100% { opacity: 0; transform: rotate(var(--ang)) translateX(var(--dist, 110px)) scale(.4) }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"></script>
<script src="./data.js"></script>
<script src="./app.js"></script>
</body>
</html>
