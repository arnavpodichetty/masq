<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05020a">
<meta name="color-scheme" content="dark">
<title>Masq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Cinzel+Decorative:wght@700;900&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05020a; }
  #root { height: 100%; }
  a { color: #e6cb7e; }
  a:hover { color: #f4d78c; }
  @keyframes imp-spot { 0%,100% { transform: translateX(-14px) rotate(-3deg); opacity:.85 } 50% { transform: translateX(14px) rotate(3deg); opacity:1 } }
  @keyframes imp-float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
  @keyframes imp-tilt { 0%,100% { transform: rotate(-4deg) } 50% { transform: rotate(4deg) } }
  @keyframes imp-shimmer { 0% { background-position: -180% 0 } 100% { background-position: 280% 0 } }
  @keyframes imp-rise { from { opacity:0; transform: translateY(14px) } to { opacity:1; transform: translateY(0) } }
  @keyframes imp-pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(200,162,76,.45) } 50% { box-shadow: 0 0 0 8px rgba(200,162,76,0) } }
  @keyframes imp-slide-up { from { opacity:0; transform: translateY(60px) } to { opacity:1; transform: translateY(0) } }
  @keyframes imp-slide-in { from { opacity:0 } to { opacity:1 } }
  @keyframes imp-fade-in { from { opacity:0 } to { opacity:1 } }
  @keyframes imp-scale-in { from { opacity:0; transform: scale(.94) } to { opacity:1; transform: scale(1) } }
  @keyframes imp-backdrop { from { opacity:0 } to { opacity:1 } }
  .imp-btn { transition: transform .12s ease, opacity .12s ease; }
  .imp-btn:active { transform: scale(.95); opacity:.82; }

  /* ---- Jester Mode ---- */
  .jester-page-fx {
    position: fixed; inset: -40%; pointer-events: none; opacity: .45;
    background: repeating-conic-gradient(from 45deg, rgba(123,47,247,.2) 0deg 90deg, rgba(0,0,0,0) 90deg 180deg);
    background-size: 76px 76px;
    animation: jpage-drift 26s linear infinite, jpage-hue 18s linear infinite;
  }
  @keyframes jpage-drift { to { transform: translate(76px, 76px) } }
  @keyframes jpage-hue { to { filter: hue-rotate(360deg) } }
  .jester-fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .jfx { position: absolute; bottom: -4%; opacity: 0; animation: jfx-rise linear infinite; }
  .jfx.c0 { color: #ffd23f; text-shadow: 0 0 9px rgba(255,210,63,.85); }
  .jfx.c1 { color: #ff3d8b; text-shadow: 0 0 9px rgba(255,61,139,.85); }
  .jfx.c2 { color: #a78bfa; text-shadow: 0 0 9px rgba(139,92,246,.95); }
  .jfx.c3 { color: #4ade80; text-shadow: 0 0 9px rgba(74,222,128,.85); }
  @keyframes jfx-rise {
    0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0 }
    8%   { opacity: .8 }
    50%  { transform: translateY(-480px) translateX(16px) rotate(210deg); opacity: .55 }
    92%  { opacity: .35 }
    100% { transform: translateY(-980px) translateX(-12px) rotate(420deg); opacity: 0 }
  }
  body.jester .j-title {
    background: linear-gradient(90deg, #ffd23f, #ff3d8b, #a78bfa, #4ade80, #ffd23f);
    background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: j-shimmer 3.2s linear infinite;
  }
  @keyframes j-shimmer { to { background-position: 250% 0 } }
  body.jester .j-glow { animation: j-cta 2.4s ease-in-out infinite; }
  @keyframes j-cta {
    0%, 100% { box-shadow: 0 8px 26px rgba(255,61,139,.5), 0 0 0 0 rgba(255,210,63,.35) }
    50%      { box-shadow: 0 10px 34px rgba(139,92,246,.6), 0 0 24px 4px rgba(255,210,63,.22) }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"></script>
<script src="./data.js"></script>
<script src="./app.js"></script>
</body>
</html>
